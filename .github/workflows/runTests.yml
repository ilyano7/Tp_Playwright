name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag Cucumber à exécuter (ex: @checkout, @smoke, not @wip)"
        required: false
        default: "@smoke"
        type: string

env:
  # Tag utilisé sur push/pull_request (déclenchement automatique).
  # Modifie cette valeur pour changer le tag par défaut.
  DEFAULT_TAG: "@smoke"

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm ci

      - name: Installer les navigateurs Playwright
        run: npx playwright install --with-deps

      - name: Déterminer le tag à utiliser
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ env.DEFAULT_TAG }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Lancer les tests Cucumber avec Playwright
        run: npx cucumber-js --tags "${{ steps.tag.outputs.value }}"

      - name: Uploader le rapport HTML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Uploader les vidéos des tests échoués
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 30
